openapi: 3.0.3
info:
  title: CRMtree API — mobile contract
  version: 1.0.0
  description: |
    The endpoints the CRMtree mobile app (ADR 001) is allowed to depend on.
    The Dart client in `crmtree-mobile` is generated from this file.

    Rules:
    - Old app builds stay installed for weeks. A change that removes or renames
      a field, tightens a type, or adds a required request field is BREAKING
      and needs a new endpoint or version (CI runs `oasdiff` against master).
    - Response objects are open (`additionalProperties: true`): the web API
      returns many more fields than listed. Only the fields documented here
      are part of the contract; the app must ignore the rest.
    - Money values (`value_pln`, `contract_value`) are decimal STRINGS, as
      PostgreSQL NUMERIC serializes — never parse them as binary floats.
    - Every session talks to its own tenant host (`{slug}.crmtree.pl/api`).
      `POST /auth/mobile/login` and `GET /public/app-config` are the only
      calls made on the tenant-less host.
servers:
  - url: https://{tenant}.crmtree.pl/api
    description: Production, per-tenant host
    variables:
      tenant:
        default: app
        description: Tenant slug; `app` for the tenant-less host used before login
  - url: https://int.crmtree.pl/api
    description: Integration environment (tenant comes from the token)
tags:
  - name: app
  - name: auth
  - name: leads
  - name: partners
  - name: activities
  - name: agenda
  - name: assistant
  - name: projects
security:
  - bearerAuth: []

paths:
  /public/app-config:
    get:
      tags: [app]
      operationId: getAppConfig
      summary: Minimum supported app version (read on every start, before login)
      security: []
      responses:
        '200':
          description: App configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppConfig' }

  /auth/mobile/login:
    post:
      tags: [auth]
      operationId: mobileLogin
      summary: Log in with email and password; returns every tenant the password matches
      description: |
        Call on the tenant-less host. One account → enter it directly; several →
        show "Wybierz firmę". Tenant names are only ever revealed after a correct
        password. Rate limited per IP and per email (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MobileLoginRequest' }
      responses:
        '200':
          description: One entry per matching account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileLoginResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401':
          description: Wrong email or password (never says which, never names a tenant)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: |
            `code: MOBILE_ROLE_NOT_ALLOWED` — the password matched, but only an
            account without a sales role. Show "aplikacja jest dla handlowców" with a link to the web app.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Rotate the refresh token and get a new 15-minute access token
      description: |
        The old refresh token is revoked on use. Serialize refreshes in the app
        (one at a time): presenting an already-rotated mobile token returns 401
        `REFRESH_TOKEN_REUSED` and signs this account out on this device.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/Error' }
        '401':
          description: |
            Invalid, expired or revoked token → full login required. `code` may be
            `REFRESH_TOKEN_REUSED` or `TENANT_INACTIVE`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke this session's refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        '401': { $ref: '#/components/responses/Error' }

  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The signed-in user, role and enabled tenant modules
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: '`code: TENANT_HOST_MISMATCH` — the token belongs to another tenant than this host'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/change-password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change the password (also the forced step when must_change_password is true)
      description: Signs this account out on every other phone; send `device_id` to keep this one signed in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                current_password:
                  type: string
                  description: Required unless the account is in must_change_password mode
                new_password: { type: string, minLength: 8 }
                device_id: { type: string }
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /auth/devices:
    get:
      tags: [auth]
      operationId: listDevices
      summary: Phones signed in to this account
      responses:
        '200':
          description: One entry per device, most recently active first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Error' }

  /auth/devices/{deviceId}:
    delete:
      tags: [auth]
      operationId: signOutDevice
      summary: Sign one phone out of this account
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /auth/devices/{deviceId}/push-token:
    parameters:
      - { name: deviceId, in: path, required: true, schema: { type: string, minLength: 8, maxLength: 128 }, description: The device id sent at mobile login }
    put:
      tags: [auth]
      operationId: registerPushToken
      summary: Tell the backend where to push notifications for this phone
      description: |
        Call after sign-in and whenever Firebase rotates the token. A token
        registered by another account on the same phone moves to this one.
        Signing out, here or from "My devices" on the web, forgets it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: { type: string, minLength: 20, description: Firebase Cloud Messaging registration token }
                platform: { type: string, enum: [android, ios] }
      responses:
        '204': { description: Registered }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    delete:
      tags: [auth]
      operationId: removePushToken
      summary: Stop pushing to this phone without signing it out
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Error' }

  /crm/mobile/today:
    get:
      tags: [agenda]
      operationId: getToday
      summary: Everything the "Dziś" screen shows, in one call
      description: |
        Only the signed-in person's own items (plus anyone they currently
        substitute for) — a manager's team view belongs to the calendar. The
        app sends the bounds of its local day, so the result is right in any
        time zone.
      parameters:
        - { name: day_start, in: query, required: true, schema: { type: string, format: date-time }, description: Start of the phone's local day }
        - { name: day_end, in: query, required: true, schema: { type: string, format: date-time }, description: Start of the next local day (exclusive) }
        - { name: month_start, in: query, required: true, schema: { type: string, format: date-time }, description: 'Start of the phone''s local calendar month, for kpis' }
        - { name: month_end, in: query, required: true, schema: { type: string, format: date-time }, description: Start of the next local month (exclusive) }
      responses:
        '200':
          description: Today's agenda, overdue items and leads waiting for a reaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodayResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /assistant/activity:
    post:
      tags: [assistant]
      operationId: askActivityAssistant
      summary: Turns what the person said into the fields of the new-activity form
      description: |
        Nothing is saved: the app opens its own form filled in with `intent`.
        The app sends the whole conversation on every turn and gets the whole
        activity understood so far. `complete` is false while something
        essential is missing (for a task or meeting: what, when and whether to
        remind; for a note or call: the content); `reply` then ends with a
        question. With `needs_company` the company is recognised by name and
        `companies` lists the matching leads and partners the user may see.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityAssistantRequest' }
      responses:
        '200':
          description: What the assistant understood
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityAssistantResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /assistant/project-task:
    post:
      tags: [assistant]
      operationId: askProjectTaskAssistant
      summary: Turns what the person said into the fields of the new project task form
      description: |
        Same conversation as /assistant/activity. The app sends the project's
        task types, priorities and members; `intent` names them by their ids.
        Essential: the task's name and the day it starts. When the person says
        how long the task takes instead of a due day, `end_date` is worked
        out from the start (the first day counts).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectTaskAssistantRequest' }
      responses:
        '200':
          description: What the assistant understood
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectTaskAssistantResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /crm/mobile/dashboard:
    get:
      tags: [agenda]
      operationId: getDashboard
      summary: The sales dashboard — figures, the funnel and the sales chart
      description: |
        Counts the leads the user may see: their own for a salesperson, the
        team for a manager, the whole company for an admin. Values are in PLN
        at today's rates. A lead on hold is not in the pipeline; a lead is won
        on the day it was last changed in the "won" stage. The app sends the
        bounds of its local week, month and chart period.
      parameters:
        - { name: week_start, in: query, required: true, schema: { type: string, format: date-time }, description: 'Start of the phone''s local week; the week before it is the comparison' }
        - { name: week_end, in: query, required: true, schema: { type: string, format: date-time }, description: Start of the next local week (exclusive) }
        - { name: month_start, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: month_end, in: query, required: true, schema: { type: string, format: date-time }, description: Start of the next local month (exclusive) }
        - { name: period_end, in: query, required: true, schema: { type: string, format: date-time }, description: 'End of the chart period (exclusive): the start of the phone''s tomorrow' }
        - { name: period_days, in: query, required: true, schema: { type: integer, enum: [7, 30, 90] } }
        - { name: assigned_to, in: query, schema: { type: string, format: uuid }, description: 'One salesperson, for a manager; 403 when outside the user''s scope' }
      responses:
        '200':
          description: The dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /crm/dashboard/activities:
    get:
      tags: [agenda]
      operationId: listRecentActivities
      summary: What happened lately on the leads and partners the user may see, newest first
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: assigned_to, in: query, schema: { type: string, format: uuid }, description: Only what belongs to this salesperson }
      responses:
        '200':
          description: One page of the feed
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecentActivity' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /crm/leads:
    get:
      tags: [leads]
      operationId: listLeads
      summary: Leads visible to the user (own leads for a salesperson, the team for a manager)
      parameters:
        - { name: stage, in: query, schema: { $ref: '#/components/schemas/LeadStage' }, description: Without it archived leads are hidden }
        - { name: mine, in: query, schema: { type: boolean } }
        - { name: hot, in: query, schema: { type: boolean } }
        - { name: hold_only, in: query, schema: { type: boolean } }
        - { name: source, in: query, schema: { type: string }, description: 'A source value, or several separated by commas' }
        - { name: search, in: query, schema: { type: string }, description: 'Matches company, contact, email, NIP, phone, notes and tags' }
        - { name: assigned_to, in: query, schema: { type: string }, description: User id or comma-separated ids (managers only) }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 50 } }
      responses:
        '200':
          description: A page of leads, most recently updated first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadListResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [leads]
      operationId: createLead
      summary: Add a lead
      description: |
        A salesperson always becomes the owner (`assigned_to` is ignored).
        A NIP already used by another lead or partner returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadCreate' }
      responses:
        '201':
          description: Created lead
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lead' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/settings:
    get:
      tags: [app]
      operationId: getSettings
      summary: The company's settings as a flat key-value map
      description: |
        The app reads `crm_lost_reasons` from it: a JSON-encoded array of the
        reasons offered when a lead is marked as lost.
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsResponse' }
        '401': { $ref: '#/components/responses/Error' }

  /crm/leads/sources:
    get:
      tags: [leads]
      operationId: listLeadSources
      summary: The company's lead sources, for the source filter
      responses:
        '200':
          description: Sources
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [value, label]
                  additionalProperties: true
                  properties:
                    value: { type: string }
                    label: { type: string }
        '401': { $ref: '#/components/responses/Error' }

  /crm/leads/users:
    get:
      tags: [leads]
      operationId: listCrmUsers
      summary: CRM users of the tenant (for "assigned to" pickers)
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CrmUser' }
        '401': { $ref: '#/components/responses/Error' }

  /crm/leads/tasks:
    get:
      tags: [agenda]
      operationId: listTasks
      summary: Open activities (calls, meetings, tasks, notes) on leads, for the "Dziś" and task screens
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/ActivityType' } }
        - { name: assigned_to, in: query, schema: { type: string }, description: User id or comma-separated ids (managers only) }
        - { name: include_closed, in: query, schema: { type: boolean, default: false } }
        - { name: include_no_date, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Activities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AgendaItem' }
        '401': { $ref: '#/components/responses/Error' }

  /crm/leads/calendar:
    get:
      tags: [agenda]
      operationId: listCalendar
      summary: Dated meetings, calls and open tasks on leads AND partners in a date range
      parameters:
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date }, description: Inclusive }
        - { name: assigned_to, in: query, schema: { type: string }, description: User id (managers only) }
      responses:
        '200':
          description: Calendar entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AgendaItem' }
        '401': { $ref: '#/components/responses/Error' }

  /crm/leads/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [leads]
      operationId: getLead
      summary: Lead card with its activities and extra contacts
      responses:
        '200':
          description: Lead
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [leads]
      operationId: updateLead
      summary: Edit a lead or move it to another stage
      description: |
        Stages must be passed in order; skipping one returns 422 with an
        explanation, and a lead on hold returns 409. A salesperson cannot
        reassign (`assigned_to` is ignored).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadUpdate' }
      responses:
        '200':
          description: Updated lead
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lead' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /crm/leads/{id}/logo-img:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [leads]
      operationId: getLeadLogo
      summary: The company logo of a lead, as image bytes
      description: Only leads whose `logo_url` is set have one.
      responses:
        '200':
          description: The image
          content:
            image/*:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Error' }
        '404': { description: The lead has no logo }

  /crm/leads/{id}/contacts:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [leads]
      operationId: replaceLeadContacts
      summary: Replace the lead's additional contacts with the given set
      description: Rows without a name, an email and a phone are skipped. The main contact stays on the lead itself.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactsReplace' }
      responses:
        '200':
          description: The contacts now stored
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExtraContact' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /crm/leads/{id}/activities:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [activities]
      operationId: listLeadActivities
      summary: Activities of a lead, newest first
      responses:
        '200':
          description: Activities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Activity' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [activities]
      operationId: createLeadActivity
      summary: Add a call note, meeting, task or note to a lead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityCreate' }
      responses:
        '201':
          description: Created activity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /crm/leads/{id}/activities/{actId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: actId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [activities]
      operationId: updateLeadActivity
      summary: Edit an activity or close it (status closed + close_comment)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityUpdate' }
      responses:
        '200':
          description: Updated activity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [activities]
      operationId: deleteLeadActivity
      summary: Delete an activity
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /crm/partners:
    get:
      tags: [partners]
      operationId: listPartners
      summary: Partners (customers)
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string }, description: 'active, inactive or churned; a partner without a CRM status counts as active' }
        - { name: manager_id, in: query, schema: { type: string }, description: Managers only }
        - { name: group_name, in: query, schema: { type: string } }
        - { name: industry, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, default: 50 } }
        - { name: sort, in: query, schema: { type: string, enum: [company, status, contract_signed, contract_value, created_at, industry, group_name, manager_name, contract_expires], default: company } }
        - { name: dir, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
      responses:
        '200':
          description: A page of partners
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerListResponse' }
        '401': { $ref: '#/components/responses/Error' }

  /crm/partners/group-names:
    get:
      tags: [partners]
      operationId: listPartnerGroupNames
      summary: Names of the partner groups, for the group filter
      responses:
        '200':
          description: Group names
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        '401': { $ref: '#/components/responses/Error' }

  /crm/partners/tasks:
    get:
      tags: [agenda]
      operationId: listPartnerTasks
      summary: Open activities on partners (same shape as lead tasks)
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/ActivityType' } }
        - { name: assigned_to, in: query, schema: { type: string } }
        - { name: include_closed, in: query, schema: { type: boolean, default: false } }
        - { name: include_no_date, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Activities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AgendaItem' }
        '401': { $ref: '#/components/responses/Error' }

  /crm/partners/{partnerId}:
    parameters:
      - $ref: '#/components/parameters/PartnerId'
    get:
      tags: [partners]
      operationId: getPartner
      summary: Partner card with its activities and extra contacts
      responses:
        '200':
          description: Partner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [partners]
      operationId: updatePartner
      summary: Edit a partner's own data
      description: A NIP already used by another lead or partner returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartnerUpdate' }
      responses:
        '200':
          description: The updated partner row
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /crm/sales-data/report:
    get:
      tags: [partners]
      operationId: getSalesReport
      summary: Sales from the data warehouse, per partner, for a range of months
      parameters:
        - { name: period_from, in: query, schema: { type: string }, description: 'First month, YYYY-MM' }
        - { name: period_to, in: query, schema: { type: string }, description: 'Last month, YYYY-MM' }
        - { name: partner_id, in: query, schema: { type: integer }, description: Data-warehouse id of one partner (dwh_partner_id) }
      responses:
        '200':
          description: The report; the app reads by_partner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesReport' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /crm/partners/{partnerId}/contacts:
    parameters:
      - $ref: '#/components/parameters/PartnerId'
    post:
      tags: [partners]
      operationId: replacePartnerContacts
      summary: Replace the partner's additional contacts with the given set
      description: Same contract as the lead's contacts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactsReplace' }
      responses:
        '200':
          description: The contacts now stored
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExtraContact' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /crm/partners/{partnerId}/logo-img:
    parameters:
      - $ref: '#/components/parameters/PartnerId'
    get:
      tags: [partners]
      operationId: getPartnerLogo
      summary: The company logo of a partner, as image bytes
      responses:
        '200':
          description: The image
          content:
            image/*:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Error' }
        '404': { description: The partner has no logo }

  /crm/partners/{partnerId}/activities/{actId}:
    parameters:
      - $ref: '#/components/parameters/PartnerId'
      - { name: actId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [activities]
      operationId: updatePartnerActivity
      summary: Edit a partner activity or close it (status closed + close_comment)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityUpdate' }
      responses:
        '200':
          description: Updated activity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /crm/partners/{partnerId}/activities:
    parameters:
      - $ref: '#/components/parameters/PartnerId'
    get:
      tags: [activities]
      operationId: listPartnerActivities
      summary: Activities of a partner, newest first
      responses:
        '200':
          description: Activities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Activity' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [activities]
      operationId: createPartnerActivity
      summary: Add a call note, meeting, task or note to a partner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityCreate' }
      responses:
        '201':
          description: Created activity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /projects/config:
    get:
      tags: [projects]
      operationId: getProjectsConfig
      summary: The company's task dictionaries and what the Projects module offers this user
      description: |
        Statuses, types and priorities are the company's own; inactive items
        stay in the lists so old tasks keep their names. Every route of the
        Projects module answers 403 while the company has the module switched
        off (`tenant_features.projects` in `GET /auth/me`).
      responses:
        '200':
          description: The configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectsConfig' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: One page of the projects the user is a member of (a tenant admin — of all projects)
      description: |
        Open projects unless `status` says otherwise. Without `sort` the rows
        are ordered by status, then by name. `finance` of a row is filled only
        for a project whose finance the user may read.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, closed, all], default: open } }
        - { $ref: '#/components/parameters/ProjectFilterName' }
        - { $ref: '#/components/parameters/ListStartFrom' }
        - { $ref: '#/components/parameters/ListStartTo' }
        - { $ref: '#/components/parameters/ListEndFrom' }
        - { $ref: '#/components/parameters/ListEndTo' }
        - { $ref: '#/components/parameters/ProjectFilterDelayed' }
        - { $ref: '#/components/parameters/ProjectFilterDelayReason' }
        - { $ref: '#/components/parameters/ProjectFilterLeadId' }
        - { $ref: '#/components/parameters/ProjectFilterPartnerId' }
        - { $ref: '#/components/parameters/ProjectFilterMyRole' }
        - { $ref: '#/components/parameters/ProjectFilterPm' }
        - { $ref: '#/components/parameters/ProjectFilterOverdueMin' }
        - { $ref: '#/components/parameters/ProjectFilterOverdueMax' }
        - { $ref: '#/components/parameters/ProjectFilterAtRiskMin' }
        - { $ref: '#/components/parameters/ProjectFilterAtRiskMax' }
        - { $ref: '#/components/parameters/ProjectFilterProgressMin' }
        - { $ref: '#/components/parameters/ProjectFilterProgressMax' }
        - { $ref: '#/components/parameters/ListCostMin' }
        - { $ref: '#/components/parameters/ListCostMax' }
        - { $ref: '#/components/parameters/ProjectFilterRevenueMin' }
        - { $ref: '#/components/parameters/ProjectFilterRevenueMax' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/ProjectSort' }
        - { $ref: '#/components/parameters/SortOrder' }
      responses:
        '200':
          description: One page of projects
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectListResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /projects/my-tasks:
    get:
      tags: [projects]
      operationId: listMyProjectTasks
      summary: One page of the tasks assigned to the user in open projects
      description: |
        Sorted by due date unless `sort` says otherwise. There is no
        `assignee` filter here (one sent anyway is ignored). `cost_total` is
        filled only in projects whose finance the user may read.
      parameters:
        - { name: include_done, in: query, schema: { type: boolean, default: false }, description: Also tasks in a status of the category "done" }
        - { $ref: '#/components/parameters/TaskFilterProjectIds' }
        - { $ref: '#/components/parameters/TaskFilterName' }
        - { $ref: '#/components/parameters/TaskFilterNumber' }
        - { $ref: '#/components/parameters/TaskFilterStatusIds' }
        - { $ref: '#/components/parameters/TaskFilterStatusCategory' }
        - { $ref: '#/components/parameters/TaskFilterPriorityIds' }
        - { $ref: '#/components/parameters/TaskFilterTypeIds' }
        - { $ref: '#/components/parameters/ListStartFrom' }
        - { $ref: '#/components/parameters/ListStartTo' }
        - { $ref: '#/components/parameters/ListEndFrom' }
        - { $ref: '#/components/parameters/ListEndTo' }
        - { $ref: '#/components/parameters/TaskFilterOriginalEndFrom' }
        - { $ref: '#/components/parameters/TaskFilterOriginalEndTo' }
        - { $ref: '#/components/parameters/TaskFilterSlipMin' }
        - { $ref: '#/components/parameters/TaskFilterSlipMax' }
        - { $ref: '#/components/parameters/ListCostMin' }
        - { $ref: '#/components/parameters/ListCostMax' }
        - { $ref: '#/components/parameters/TaskFilterTimeliness' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/TaskSort' }
        - { $ref: '#/components/parameters/SortOrder' }
      responses:
        '200':
          description: One page of flat task rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectTaskListResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /projects/assigned-tasks:
    get:
      tags: [projects]
      operationId: listAssignedProjectTasks
      summary: Every project task assigned to the user (or to the given people) in open projects, soonest due first
      description: |
        Not paged on purpose: it feeds the calendar and the "today" screen,
        which need the whole set. Another person's tasks are returned only
        from projects the user is a member of (a tenant admin: from all); an
        external participant only ever gets their own.
      parameters:
        - { name: assigned_to, in: query, schema: { type: string }, description: 'User ids (uuid) separated by commas; without it the signed-in user' }
        - { name: include_done, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: The tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AssignedProjectTask' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /projects/portfolio/projects:
    get:
      tags: [projects]
      operationId: listPortfolioProjects
      summary: One page of the projects of the cross-project view
      description: |
        The cross-project view (`has_cross_project_view` in
        `GET /projects/config`): a tenant admin sees every open project, anyone
        else the open projects where they are PM or controller; a user with
        neither gets 403 on every `/projects/portfolio` route. Closed projects
        are never part of it, so there is no `status` filter.
      parameters:
        - { $ref: '#/components/parameters/ProjectFilterName' }
        - { $ref: '#/components/parameters/ListStartFrom' }
        - { $ref: '#/components/parameters/ListStartTo' }
        - { $ref: '#/components/parameters/ListEndFrom' }
        - { $ref: '#/components/parameters/ListEndTo' }
        - { $ref: '#/components/parameters/ProjectFilterDelayed' }
        - { $ref: '#/components/parameters/ProjectFilterDelayReason' }
        - { $ref: '#/components/parameters/ProjectFilterLeadId' }
        - { $ref: '#/components/parameters/ProjectFilterPartnerId' }
        - { $ref: '#/components/parameters/ProjectFilterMyRole' }
        - { $ref: '#/components/parameters/ProjectFilterPm' }
        - { $ref: '#/components/parameters/ProjectFilterOverdueMin' }
        - { $ref: '#/components/parameters/ProjectFilterOverdueMax' }
        - { $ref: '#/components/parameters/ProjectFilterAtRiskMin' }
        - { $ref: '#/components/parameters/ProjectFilterAtRiskMax' }
        - { $ref: '#/components/parameters/ProjectFilterProgressMin' }
        - { $ref: '#/components/parameters/ProjectFilterProgressMax' }
        - { $ref: '#/components/parameters/ListCostMin' }
        - { $ref: '#/components/parameters/ListCostMax' }
        - { $ref: '#/components/parameters/ProjectFilterRevenueMin' }
        - { $ref: '#/components/parameters/ProjectFilterRevenueMax' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/ProjectSort' }
        - { $ref: '#/components/parameters/SortOrder' }
      responses:
        '200':
          description: One page of projects (without `projects` and `can_create`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectListResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /projects/portfolio/tasks:
    get:
      tags: [projects]
      operationId: listPortfolioTasks
      summary: One page of the tasks of every project of the cross-project view
      description: |
        Sorted by due date unless `sort` says otherwise. Costs are in each
        project's own currency and are never converted.
      parameters:
        - { $ref: '#/components/parameters/TaskFilterProjectIds' }
        - { $ref: '#/components/parameters/TaskFilterName' }
        - { $ref: '#/components/parameters/TaskFilterNumber' }
        - { $ref: '#/components/parameters/TaskFilterStatusIds' }
        - { $ref: '#/components/parameters/TaskFilterStatusCategory' }
        - { $ref: '#/components/parameters/TaskFilterPriorityIds' }
        - { $ref: '#/components/parameters/TaskFilterTypeIds' }
        - { $ref: '#/components/parameters/TaskFilterAssignee' }
        - { $ref: '#/components/parameters/ListStartFrom' }
        - { $ref: '#/components/parameters/ListStartTo' }
        - { $ref: '#/components/parameters/ListEndFrom' }
        - { $ref: '#/components/parameters/ListEndTo' }
        - { $ref: '#/components/parameters/TaskFilterOriginalEndFrom' }
        - { $ref: '#/components/parameters/TaskFilterOriginalEndTo' }
        - { $ref: '#/components/parameters/TaskFilterSlipMin' }
        - { $ref: '#/components/parameters/TaskFilterSlipMax' }
        - { $ref: '#/components/parameters/ListCostMin' }
        - { $ref: '#/components/parameters/ListCostMax' }
        - { $ref: '#/components/parameters/TaskFilterTimeliness' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/TaskSort' }
        - { $ref: '#/components/parameters/SortOrder' }
      responses:
        '200':
          description: One page of flat task rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectTaskListResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /projects/portfolio/gantt:
    get:
      tags: [projects]
      operationId: getPortfolioGantt
      summary: The filtered tasks of the cross-project view for a timeline, not paged
      description: |
        Ordered by project key, then task number; build the tree from
        `parent_task_id`. Stops at `limit` tasks and says so in `truncated`.
      parameters:
        - { $ref: '#/components/parameters/TaskFilterProjectIds' }
        - { $ref: '#/components/parameters/TaskFilterName' }
        - { $ref: '#/components/parameters/TaskFilterNumber' }
        - { $ref: '#/components/parameters/TaskFilterStatusIds' }
        - { $ref: '#/components/parameters/TaskFilterStatusCategory' }
        - { $ref: '#/components/parameters/TaskFilterPriorityIds' }
        - { $ref: '#/components/parameters/TaskFilterTypeIds' }
        - { $ref: '#/components/parameters/TaskFilterAssignee' }
        - { $ref: '#/components/parameters/ListStartFrom' }
        - { $ref: '#/components/parameters/ListStartTo' }
        - { $ref: '#/components/parameters/ListEndFrom' }
        - { $ref: '#/components/parameters/ListEndTo' }
        - { $ref: '#/components/parameters/TaskFilterOriginalEndFrom' }
        - { $ref: '#/components/parameters/TaskFilterOriginalEndTo' }
        - { $ref: '#/components/parameters/TaskFilterSlipMin' }
        - { $ref: '#/components/parameters/TaskFilterSlipMax' }
        - { $ref: '#/components/parameters/ListCostMin' }
        - { $ref: '#/components/parameters/ListCostMax' }
        - { $ref: '#/components/parameters/TaskFilterTimeliness' }
      responses:
        '200':
          description: The tasks of the timeline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectGanttResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /projects/portfolio/people:
    get:
      tags: [projects]
      operationId: listPortfolioPeople
      summary: Everyone who is a member of, or assigned to a task in, a project of the cross-project view
      description: Feeds the person filter. Ordered by name, deactivated accounts included; cut at `limit`.
      responses:
        '200':
          description: The people
          content:
            application/json:
              schema:
                type: object
                required: [people, truncated, limit]
                properties:
                  people:
                    type: array
                    items: { $ref: '#/components/schemas/ProjectPerson' }
                  truncated: { type: boolean }
                  limit: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /projects/portfolio/project-options:
    get:
      tags: [projects]
      operationId: listPortfolioProjectOptions
      summary: Id, key, name and dates of every project of the cross-project view
      description: Feeds the project filter and the end-date lines of the timeline. Ordered by key; cut at `limit`.
      responses:
        '200':
          description: The projects
          content:
            application/json:
              schema:
                type: object
                required: [projects, truncated, limit]
                properties:
                  projects:
                    type: array
                    items:
                      type: object
                      required: [id, key, name]
                      properties:
                        id: { type: string, format: uuid }
                        key: { type: string }
                        name: { type: string }
                        start_date: { type: string, format: date, nullable: true }
                        end_date: { type: string, format: date, nullable: true }
                  truncated: { type: boolean }
                  limit: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /projects/{projectId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [projects]
      operationId: getProject
      summary: Project card — the project, its members, its custom fields and what the user may do in it
      description: |
        404 both for a project that does not exist and for one the user is not
        a member of (a tenant admin opens every project).
      responses:
        '200':
          description: The project card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectCard' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /projects/{projectId}/messages:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [projects]
      operationId: listProjectMessages
      summary: The general chat of the project — its newest 200 messages, oldest first
      responses:
        '200':
          description: The messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProjectMessage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [projects]
      operationId: postProjectMessage
      summary: Write in the general chat of the project
      description: Every member may write. A closed project is read-only (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectMessageCreate' }
      responses:
        '201':
          description: The message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMessage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /projects/{projectId}/tasks:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [projects]
      operationId: listProjectTasks
      summary: Every task of the project the user may see, by task number, not paged
      description: |
        The whole tree of the project view: nest by `parent_task_id`. An
        external participant gets only the tasks assigned to them. Rows carry
        no `permissions` and no cost; the filtered, paged list is
        `/projects/{projectId}/tasks/search`.
      parameters:
        - { $ref: '#/components/parameters/TaskFilterMine' }
      responses:
        '200':
          description: The tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProjectTask' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [projects]
      operationId: createProjectTask
      summary: Add a task to the project (the PM or a tenant admin only)
      description: |
        Without `status_id` the task gets the company's first "to do" status.
        Anyone else gets 403; a closed project answers 409. The first
        `end_date` a task gets stays as its `original_end_date`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectTaskCreate' }
      responses:
        '201':
          description: The created task (without `permissions`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectTask' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /projects/{projectId}/tasks/search:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [projects]
      operationId: searchProjectTasks
      summary: One page of the project's tasks as flat rows — filtered and sorted
      description: |
        Sorted by task number unless `sort` says otherwise. An external
        participant gets only the tasks assigned to them. `cost_total` is
        filled only for someone who may read the project's finance.
      parameters:
        - { $ref: '#/components/parameters/TaskFilterMine' }
        - { $ref: '#/components/parameters/TaskFilterName' }
        - { $ref: '#/components/parameters/TaskFilterNumber' }
        - { $ref: '#/components/parameters/TaskFilterStatusIds' }
        - { $ref: '#/components/parameters/TaskFilterStatusCategory' }
        - { $ref: '#/components/parameters/TaskFilterPriorityIds' }
        - { $ref: '#/components/parameters/TaskFilterTypeIds' }
        - { $ref: '#/components/parameters/TaskFilterAssignee' }
        - { $ref: '#/components/parameters/ListStartFrom' }
        - { $ref: '#/components/parameters/ListStartTo' }
        - { $ref: '#/components/parameters/ListEndFrom' }
        - { $ref: '#/components/parameters/ListEndTo' }
        - { $ref: '#/components/parameters/TaskFilterOriginalEndFrom' }
        - { $ref: '#/components/parameters/TaskFilterOriginalEndTo' }
        - { $ref: '#/components/parameters/TaskFilterSlipMin' }
        - { $ref: '#/components/parameters/TaskFilterSlipMax' }
        - { $ref: '#/components/parameters/ListCostMin' }
        - { $ref: '#/components/parameters/ListCostMax' }
        - { $ref: '#/components/parameters/TaskFilterTimeliness' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/TaskSort' }
        - { $ref: '#/components/parameters/SortOrder' }
      responses:
        '200':
          description: One page of flat task rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectTaskListResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /projects/{projectId}/tasks/gantt:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [projects]
      operationId: getProjectGantt
      summary: The project's filtered tasks for a timeline, not paged
      description: Ordered by task number; build the tree from `parent_task_id`. Stops at `limit` tasks and says so in `truncated`.
      parameters:
        - { $ref: '#/components/parameters/TaskFilterMine' }
        - { $ref: '#/components/parameters/TaskFilterName' }
        - { $ref: '#/components/parameters/TaskFilterNumber' }
        - { $ref: '#/components/parameters/TaskFilterStatusIds' }
        - { $ref: '#/components/parameters/TaskFilterStatusCategory' }
        - { $ref: '#/components/parameters/TaskFilterPriorityIds' }
        - { $ref: '#/components/parameters/TaskFilterTypeIds' }
        - { $ref: '#/components/parameters/TaskFilterAssignee' }
        - { $ref: '#/components/parameters/ListStartFrom' }
        - { $ref: '#/components/parameters/ListStartTo' }
        - { $ref: '#/components/parameters/ListEndFrom' }
        - { $ref: '#/components/parameters/ListEndTo' }
        - { $ref: '#/components/parameters/TaskFilterOriginalEndFrom' }
        - { $ref: '#/components/parameters/TaskFilterOriginalEndTo' }
        - { $ref: '#/components/parameters/TaskFilterSlipMin' }
        - { $ref: '#/components/parameters/TaskFilterSlipMax' }
        - { $ref: '#/components/parameters/ListCostMin' }
        - { $ref: '#/components/parameters/ListCostMax' }
        - { $ref: '#/components/parameters/TaskFilterTimeliness' }
      responses:
        '200':
          description: The tasks of the timeline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectGanttResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /projects/{projectId}/tasks/{taskId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ProjectTaskId' }
    get:
      tags: [projects]
      operationId: getProjectTask
      summary: One task with what the user may do with it
      description: 404 also for a task the user may not see (an external participant sees only tasks assigned to them).
      responses:
        '200':
          description: The task with `permissions`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectTask' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [projects]
      operationId: updateProjectTask
      summary: Edit a task or change its status, as far as the user's role allows
      description: |
        Send only what changed: permissions are checked for every field that
        is present, and a field the user may not change returns 403. The PM
        and a tenant admin change everything; a participant with full access
        edits the content of tasks assigned to them; `parent_task_id` and
        `assignee_ids` are the PM's; a status change must be one of
        `permissions.allowed_status_ids`. A closed project answers 409.
        `end_date_change_reason` is kept in the task history and sent to the
        PMs; without an actual change of `end_date` it is ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectTaskUpdate' }
      responses:
        '200':
          description: The task after the change, with `permissions`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectTask' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /projects/{projectId}/tasks/{taskId}/history:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ProjectTaskId' }
    get:
      tags: [projects]
      operationId: listProjectTaskHistory
      summary: Who changed what on the task — its newest 200 changes, newest first
      responses:
        '200':
          description: The history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProjectTaskHistoryEntry' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /projects/{projectId}/tasks/{taskId}/messages:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ProjectTaskId' }
    get:
      tags: [projects]
      operationId: listProjectTaskMessages
      summary: The chat of the task — its newest 200 messages, oldest first
      description: Open to whoever may see the task.
      responses:
        '200':
          description: The messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProjectMessage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [projects]
      operationId: postProjectTaskMessage
      summary: Write in the chat of the task
      description: Whoever may see the task may write. A closed project is read-only (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectMessageCreate' }
      responses:
        '201':
          description: The message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMessage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /projects/{projectId}/finance:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [projects]
      operationId: getProjectFinance
      summary: Finance summary of the project — revenue, cost, margin, budget per category, cost per task
      description: |
        Net amounts in the project's one currency. For the PM, a tenant admin
        and the controller (`finance.can_read` on the project card); anyone
        else gets 403, and so does everyone while the company has project
        finance switched off (`finance_enabled` in `GET /projects/config`).
      responses:
        '200':
          description: The summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectFinanceSummary' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /projects/{projectId}/finance/costs:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [projects]
      operationId: listProjectCosts
      summary: Cost items of the project, newest cost date first
      description: |
        Everything for whoever reads the project's finance. An internal
        participant allowed to add costs to own tasks
        (`finance.can_add_own_costs`) gets only the items they created,
        without invoice details. Anyone else gets 403.
      parameters:
        - { name: task_id, in: query, schema: { type: string, format: uuid }, description: Only the items booked on this task }
      responses:
        '200':
          description: The cost items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProjectCostItem' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /crm/leads/{id}/projects:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [projects]
      operationId: listLeadProjects
      summary: Projects run for the lead, open ones first, each with its tasks and finance totals
      description: |
        Visible to everyone who may see the lead, member of the project or
        not; `can_open` says whether the user may enter the project itself.
        403 while the company has the Projects module switched off.
      responses:
        '200':
          description: The linked projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LinkedProject' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /crm/partners/{partnerId}/projects:
    parameters:
      - $ref: '#/components/parameters/PartnerId'
    get:
      tags: [projects]
      operationId: listPartnerProjects
      summary: Projects run for the partner, open ones first, each with its tasks and finance totals
      description: Same rules and shape as `/crm/leads/{id}/projects`.
      responses:
        '200':
          description: The linked projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LinkedProject' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /profile/project-deadline-notifications:
    put:
      tags: [projects]
      operationId: setProjectDeadlineNotifications
      summary: Turn the user's project deadline e-mails on or off, in every project at once
      description: |
        One switch for all three e-mails: the morning list of overdue tasks,
        a moved due date and a project that became delayed. There are no push
        notifications for these events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_enabled]
              properties:
                is_enabled: { type: boolean, description: 'A JSON boolean; the string "true" is rejected' }
      responses:
        '200':
          description: The switch as saved
          content:
            application/json:
              schema:
                type: object
                required: [project_deadline_notifications_enabled]
                properties:
                  project_deadline_notifications_enabled: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PartnerId:
      name: partnerId
      in: path
      required: true
      description: The partner's CRM id — `crm_uuid` from the list, `crm_id` from the card
      schema: { type: string, format: uuid }
    ProjectId: { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    ProjectTaskId: { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }

    # Lists of the Projects module share one convention: an empty value is an
    # unused filter, a malformed one is a 400.
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 50 } }
    SortOrder: { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
    TaskSort:
      name: sort
      in: query
      description: |
        `parent` groups subtasks by their parent, top-level tasks last; `cost`
        compares raw amounts, tasks without a readable cost last. Rows that
        compare equal follow in project key and task number order.
      schema:
        type: string
        enum: [number, name, parent, project, status, priority, type, assignee, start_date, end_date, original_end_date, slip_days, days_overdue, timeliness, cost]
    ProjectSort:
      name: sort
      in: query
      description: |
        `delay` puts delayed projects first, the longest overrun first; `pm`
        sorts by the alphabetically first PM; `cost` and `revenue` compare raw
        amounts in each project's own currency, projects without readable
        finance last.
      schema:
        type: string
        enum: [name, key, status, start_date, end_date, delay, pm, progress, overdue, at_risk, cost, revenue]
    ListStartFrom: { name: start_from, in: query, schema: { type: string, format: date }, description: Start date on or after this day }
    ListStartTo: { name: start_to, in: query, schema: { type: string, format: date }, description: Start date on or before this day }
    ListEndFrom: { name: end_from, in: query, schema: { type: string, format: date }, description: End (due) date on or after this day }
    ListEndTo: { name: end_to, in: query, schema: { type: string, format: date }, description: End (due) date on or before this day }
    ListCostMin:
      name: cost_min
      in: query
      description: |
        Lowest cost — of a task its `cost_total`, of a project its actual
        cost — in the project's own currency (amounts are never converted).
        A row whose cost the user may not read passes the filter.
      schema: { type: number, minimum: 0 }
    ListCostMax: { name: cost_max, in: query, schema: { type: number, minimum: 0 }, description: Highest cost; see `cost_min` }

    TaskFilterMine: { name: mine, in: query, schema: { type: boolean, default: false }, description: Only the tasks assigned to the user }
    TaskFilterName: { name: name, in: query, schema: { type: string, maxLength: 300 }, description: Part of the task name }
    TaskFilterNumber: { name: number, in: query, schema: { type: string, maxLength: 30 }, description: 'Part of the task number, e.g. `WSC-12` or `12`' }
    TaskFilterProjectIds: { name: project_ids, in: query, schema: { type: string }, description: Project ids (uuid) separated by commas }
    TaskFilterStatusIds: { name: status_ids, in: query, schema: { type: string }, description: Status ids (uuid) separated by commas }
    TaskFilterStatusCategory: { name: status_category, in: query, schema: { type: string }, description: 'Any of `todo`, `in_progress`, `done`, separated by commas' }
    TaskFilterPriorityIds: { name: priority_ids, in: query, schema: { type: string }, description: Priority ids (uuid) separated by commas }
    TaskFilterTypeIds: { name: type_ids, in: query, schema: { type: string }, description: Type ids (uuid) separated by commas }
    TaskFilterAssignee: { name: assignee, in: query, schema: { type: string }, description: 'A user id (uuid), or `unassigned` for tasks nobody is assigned to' }
    TaskFilterOriginalEndFrom: { name: original_end_from, in: query, schema: { type: string, format: date }, description: Original due date on or after this day }
    TaskFilterOriginalEndTo: { name: original_end_to, in: query, schema: { type: string, format: date }, description: Original due date on or before this day }
    TaskFilterSlipMin:
      name: slip_min
      in: query
      description: Fewest days the due date moved from the original one (negative when brought forward); a task that never moved counts as 0
      schema: { type: integer }
    TaskFilterSlipMax: { name: slip_max, in: query, schema: { type: integer }, description: Most days the due date moved; see `slip_min` }
    TaskFilterTimeliness: { name: timeliness, in: query, schema: { type: string }, description: 'Any of `overdue`, `at_risk`, `on_time`, separated by commas' }

    ProjectFilterName: { name: name, in: query, schema: { type: string, maxLength: 200 }, description: Part of the project name or of its key }
    ProjectFilterDelayed: { name: delayed, in: query, schema: { type: boolean }, description: Only delayed (`true`) or only not delayed (`false`) projects }
    ProjectFilterDelayReason: { name: delay_reason, in: query, schema: { type: string }, description: 'Any of `task_after_end`, `end_passed`, separated by commas' }
    ProjectFilterLeadId: { name: lead_id, in: query, schema: { type: integer, minimum: 1 }, description: Projects linked to this lead }
    ProjectFilterPartnerId: { name: partner_id, in: query, schema: { type: string, format: uuid }, description: Projects linked to this partner (its CRM id) }
    ProjectFilterMyRole: { name: my_role, in: query, schema: { type: string }, description: 'The user''s role in the project: any of `pm`, `controller`, `participant`, separated by commas' }
    ProjectFilterPm: { name: pm, in: query, schema: { type: string, format: uuid }, description: Projects where this user is a PM }
    ProjectFilterOverdueMin: { name: overdue_min, in: query, schema: { type: integer, minimum: 0 }, description: Fewest overdue tasks }
    ProjectFilterOverdueMax: { name: overdue_max, in: query, schema: { type: integer, minimum: 0 }, description: Most overdue tasks }
    ProjectFilterAtRiskMin: { name: at_risk_min, in: query, schema: { type: integer, minimum: 0 }, description: Fewest at-risk tasks }
    ProjectFilterAtRiskMax: { name: at_risk_max, in: query, schema: { type: integer, minimum: 0 }, description: Most at-risk tasks }
    ProjectFilterProgressMin: { name: progress_min, in: query, schema: { type: integer, minimum: 0, maximum: 100 }, description: Lowest `progress_percent` }
    ProjectFilterProgressMax: { name: progress_max, in: query, schema: { type: integer, minimum: 0, maximum: 100 }, description: Highest `progress_percent` }
    ProjectFilterRevenueMin: { name: revenue_min, in: query, schema: { type: number, minimum: 0 }, description: 'Lowest actual revenue; same rules as `cost_min`' }
    ProjectFilterRevenueMax: { name: revenue_max, in: query, schema: { type: number, minimum: 0 }, description: Highest actual revenue }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: true
      properties:
        error: { type: string, description: 'Human-readable message (Polish), safe to show' }
        code: { type: string, description: 'Machine-readable code when the app must react, e.g. TOKEN_EXPIRED' }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    AppConfig:
      type: object
      required: [min_supported_version]
      additionalProperties: true
      properties:
        min_supported_version:
          type: object
          required: [android, ios]
          properties:
            android: { type: string, example: 1.2.0 }
            ios: { type: string, example: 1.2.0 }

    MobileLoginRequest:
      type: object
      required: [email, password, device_id]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        device_id:
          type: string
          minLength: 8
          maxLength: 128
          description: Stable per-install id generated by the app; binds the refresh token to this phone
        device_name: { type: string, maxLength: 100, example: Pixel 8 }

    MobileLoginResponse:
      type: object
      required: [accounts]
      properties:
        accounts:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/MobileAccount' }

    MobileAccount:
      type: object
      required: [tenant_slug, tenant_name, access_token, refresh_token, must_change_password, user]
      additionalProperties: true
      properties:
        tenant_slug: { type: string, description: 'API host is https://{tenant_slug}.crmtree.pl/api' }
        tenant_name: { type: string }
        access_token: { type: string }
        refresh_token: { type: string }
        must_change_password: { type: boolean }
        user:
          type: object
          required: [id, display_name, crm_role]
          properties:
            id: { type: string, format: uuid }
            display_name: { type: string, nullable: true }
            crm_role: { type: string, enum: [salesperson, sales_manager] }

    TokenPair:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }

    Me:
      type: object
      required: [id, email, is_admin, must_change_password]
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        display_name: { type: string, nullable: true }
        is_admin: { type: boolean }
        tenant_id: { type: string, format: uuid, nullable: true }
        crm_role: { type: string, nullable: true, enum: [salesperson, sales_manager, null] }
        must_change_password: { type: boolean }
        tenant_features:
          type: object
          description: Module name → enabled. A missing module counts as enabled.
          additionalProperties: { type: boolean }

    Device:
      type: object
      required: [device_id, first_seen_at, last_active_at]
      properties:
        device_id: { type: string }
        device_name: { type: string, nullable: true }
        first_seen_at: { type: string, format: date-time }
        last_active_at: { type: string, format: date-time }

    CrmUser:
      type: object
      required: [id, email]
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string, nullable: true }
        email: { type: string }
        crm_role: { type: string, nullable: true }

    LeadStage:
      type: string
      enum: [new, qualification, presentation, offer, negotiation, closed_won, closed_lost, archived]

    Lead:
      type: object
      required: [id, company, stage, hot, created_at, updated_at]
      additionalProperties: true
      properties:
        id: { type: integer }
        company: { type: string }
        contact_name: { type: string, nullable: true }
        contact_title: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        website: { type: string, nullable: true }
        logo_url: { type: string, nullable: true, description: 'Set when the lead has a logo; fetch it from /crm/leads/{id}/logo-img' }
        nip: { type: string, nullable: true }
        industry: { type: string, nullable: true }
        source: { type: string, nullable: true }
        stage: { $ref: '#/components/schemas/LeadStage' }
        value_pln: { type: string, nullable: true, description: Decimal string }
        probability: { type: integer, nullable: true, minimum: 0, maximum: 100 }
        close_date: { type: string, nullable: true, description: ISO timestamp of the planned close date }
        assigned_to: { type: string, format: uuid, nullable: true }
        tags:
          type: array
          nullable: true
          items: { type: string }
        notes: { type: string, nullable: true }
        hot: { type: boolean }
        lost_reason: { type: string, nullable: true }
        hold_active: { type: boolean }
