        hot: { type: boolean }
        notes: { type: string, nullable: true }
        lost_reason: { type: string, nullable: true }
        assigned_to: { type: string, format: uuid, nullable: true }

    PartnerUpdate:
      type: object
      description: Send only the fields that change; null clears a field.
      properties:
        company: { type: string, minLength: 1 }
        contact_name: { type: string, nullable: true }
        contact_title: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        website: { type: string, nullable: true }
        nip: { type: string, nullable: true }
        address: { type: string, nullable: true }
        industry: { type: string, nullable: true }
        notes: { type: string, nullable: true }

    ContactsReplace:
      type: object
      required: [contacts]
      properties:
        contacts:
          type: array
          items:
            type: object
            properties:
              contact_name: { type: string, nullable: true }
              contact_title: { type: string, nullable: true }
              email: { type: string, nullable: true }
              phone: { type: string, nullable: true }

    ExtraContact:
      type: object
      additionalProperties: true
      properties:
        id: { type: integer }
        contact_name: { type: string, nullable: true }
        contact_title: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }

    ActivityType:
      type: string
      enum: [call, email, meeting, note, doc_sent, task]

    ActivityStatus:
      type: string
      enum: [new, open, closed]

    Activity:
      type: object
      required: [id, type, title, created_at]
      additionalProperties: true
      properties:
        id: { type: integer }
        type: { type: string, description: 'One of ActivityType; other values may appear (e.g. system entries) and must be tolerated' }
        title: { type: string }
        body: { type: string, nullable: true }
        activity_at: { type: string, format: date-time, nullable: true }
        duration_min: { type: integer, nullable: true }
        participants: { type: string, nullable: true }
        meeting_location: { type: string, nullable: true }
        status: { type: string, nullable: true }
        close_comment: { type: string, nullable: true }
        assigned_to: { type: string, format: uuid, nullable: true }
        assigned_to_name: { type: string, nullable: true }
        created_by: { type: string, format: uuid, nullable: true }
        created_by_name: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true }
        is_read: { type: boolean, nullable: true }
        reminder_type: { type: string, nullable: true }
        reminder_at: { type: string, format: date-time, nullable: true }
        priority: { type: string, nullable: true, description: 'Tasks only: asap, important, medium or low' }

    ActivityCreate:
      type: object
      required: [type, title]
      properties:
        type: { $ref: '#/components/schemas/ActivityType' }
        title: { type: string, minLength: 1 }
        body: { type: string }
        activity_at: { type: string, format: date-time, nullable: true }
        duration_min: { type: integer, nullable: true, minimum: 0 }
        participants: { type: string }
        meeting_location: { type: string, nullable: true }
        assigned_to: { type: string, format: uuid, nullable: true }
        reminder_type:
          type: string
          nullable: true
          enum: [at_due, 30m_before, 1h_before, 1d_before, 2d_before, 3d_before, custom, null]
        reminder_at: { type: string, format: date-time, nullable: true, description: Only with reminder_type custom }
        priority:
          type: string
          nullable: true
          enum: [asap, important, medium, low, null]
          description: Kept for tasks only

    ActivityUpdate:
      type: object
      description: Send only the fields that change.
      properties:
        type: { type: string, enum: [call, email, meeting, note, doc_sent] }
        title: { type: string, minLength: 1 }
        body: { type: string, nullable: true }
        activity_at: { type: string, format: date-time, nullable: true }
        participants: { type: string, nullable: true }
        meeting_location: { type: string, nullable: true }
        assigned_to: { type: string, format: uuid, nullable: true }
        status: { $ref: '#/components/schemas/ActivityStatus' }
        close_comment: { type: string, nullable: true }
        reminder_type:
          type: string
          nullable: true
          enum: [at_due, 30m_before, 1h_before, 1d_before, 2d_before, 3d_before, custom, null]
        reminder_at: { type: string, format: date-time, nullable: true }
        priority:
          type: string
          nullable: true
          enum: [asap, important, medium, low, null]

    AgendaItem:
      type: object
      required: [id, type, title, source_type, source_id]
      additionalProperties: true
      properties:
        id: { type: integer, description: Activity id; unique only together with source_type }
        type: { type: string }
        title: { type: string }
        body: { type: string, nullable: true }
        activity_at: { type: string, format: date-time, nullable: true }
        duration_min: { type: integer, nullable: true }
        meeting_location: { type: string, nullable: true }
        status: { type: string, nullable: true }
        source_type: { type: string, enum: [lead, partner] }
        source_id:
          description: Lead id (integer, sometimes sent as a numeric string) or partner CRM id (uuid string). Treat as an opaque string.
          oneOf:
            - { type: integer }
            - { type: string }
        source_name: { type: string, nullable: true, description: Company name }
        assigned_to_id: { type: string, nullable: true }
        assigned_to_name: { type: string, nullable: true }

    PartnerSummary:
      type: object
      required: [crm_uuid, company]
      additionalProperties: true
      properties:
        crm_uuid: { type: string, format: uuid, description: Use this as partnerId in paths }
        company: { type: string }
        status: { type: string, nullable: true }
        manager_id: { type: string, format: uuid, nullable: true }
        manager_name: { type: string, nullable: true }
        contract_value: { type: string, nullable: true, description: Decimal string }
        tags:
          type: array
          nullable: true
          items: { type: string }
        non_email_activity_count: { type: integer }
        new_email_count: { type: integer }
        unread_sms_count: { type: integer }
        unread_whatsapp_count: { type: integer }
        missed_call_count: { type: integer }
        churn_risk: { type: string, nullable: true }
        churn_score: { type: number, nullable: true }
        dwh_partner_id: { type: integer, nullable: true, description: Key of the partner in the sales report }
        active_since: { type: string, format: date-time, nullable: true, description: 'When the customer started: from the data warehouse, otherwise when the partner was created in the CRM' }
        website: { type: string, nullable: true }
        logo_url: { type: string, nullable: true, description: 'Set when the partner has a logo; fetch it from /crm/partners/{partnerId}/logo-img' }
        next_activity_type: { type: string, nullable: true, description: 'meeting, call or task: the earliest open dated one, overdue first' }
        next_activity_title: { type: string, nullable: true }
        next_activity_at: { type: string, format: date-time, nullable: true }

    SalesReport:
      type: object
      required: [by_partner]
      additionalProperties: true
      properties:
        kpi:
          type: object
          additionalProperties: true
          description: Totals for the period and filters
          properties:
            gross_turnover_pln: { type: string, nullable: true, description: Decimal string }
            net_turnover_pln: { type: string, nullable: true, description: Decimal string }
            revenue_pln: { type: string, nullable: true, description: 'Margin, decimal string' }
            transactions_count: { type: integer, nullable: true }
        by_product:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              product_type: { type: string, nullable: true, description: The warehouse's own service category }
              gross_turnover_pln: { type: string, nullable: true }
              revenue_pln: { type: string, nullable: true }
        by_partner:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              partner_id: { type: string, format: uuid, nullable: true, description: CRM partner id }
              dwh_partner_id: { type: integer, nullable: true }
              gross_turnover_pln: { type: string, nullable: true, description: Decimal string }
              revenue_pln: { type: string, nullable: true, description: 'Margin, decimal string' }

    PartnerListResponse:
      type: object
      required: [data, total, page, limit]
      additionalProperties: true
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PartnerSummary' }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }

    PartnerDetail:
      type: object
      required: [crm_id, company, activities]
      additionalProperties: true
      properties:
        crm_id: { type: string, format: uuid, description: Use this as partnerId in paths }
        company: { type: string }
        nip: { type: string, nullable: true }
        address: { type: string, nullable: true }
        contact_name: { type: string, nullable: true }
        contact_title: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        website: { type: string, nullable: true }
        industry: { type: string, nullable: true }
        status: { type: string, nullable: true }
        manager_id: { type: string, format: uuid, nullable: true }
        manager_name: { type: string, nullable: true }
        contract_value: { type: string, nullable: true, description: Decimal string }
        contract_signed: { type: string, nullable: true }
        contract_expires: { type: string, nullable: true }
        active_since: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
        tags:
          type: array
          nullable: true
          items: { type: string }
        activities:
          type: array
          items: { $ref: '#/components/schemas/Activity' }
        extra_contacts:
          type: array
          items: { $ref: '#/components/schemas/ExtraContact' }

    TodayResponse:
      type: object
      required: [agenda, overdue, attention, kpis]
      properties:
        kpis: { $ref: '#/components/schemas/TodayKpis' }
        agenda:
          description: Open meetings, calls and tasks dated within the day, earliest first
          type: array
          items: { $ref: '#/components/schemas/TodayItem' }
        overdue:
          description: Open meetings, calls and tasks dated before the day (at most the 50 most recent per source), oldest first
          type: array
          items: { $ref: '#/components/schemas/TodayItem' }
        attention:
          description: The person's leads with unread messages or missed calls, most recently updated first
          type: array
          items: { $ref: '#/components/schemas/AttentionLead' }

    TodayItem:
      type: object
      required: [id, type, title, activity_at, status, source_type, source_id]
      properties:
        id: { type: integer, description: Activity id; unique only together with source_type }
        type: { type: string, enum: [meeting, call, task] }
        title: { type: string }
        body: { type: string, nullable: true }
        activity_at: { type: string, format: date-time }
        duration_min: { type: integer, nullable: true }
        meeting_location: { type: string, nullable: true }
        status: { type: string, enum: [new, open] }
        source_type: { type: string, enum: [lead, partner] }
        source_id: { type: string, description: 'Lead id or partner CRM id, always a string' }
        source_name: { type: string, nullable: true, description: Company name }

    AttentionLead:
      type: object
      required: [lead_id, company, new_email_count, unread_sms_count, unread_whatsapp_count, missed_call_count]
      properties:
        lead_id: { type: string }
        company: { type: string }
        logo_url: { type: string, nullable: true, description: 'Set when the lead has a logo; fetch it from /crm/leads/{id}/logo-img' }
        website: { type: string, nullable: true }
        new_email_count: { type: integer }
        unread_sms_count: { type: integer }
        unread_whatsapp_count: { type: integer }
        missed_call_count: { type: integer }

    AssistantMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, minLength: 1, maxLength: 2000 }

    AssistantOption:
      type: object
      required: [id, name]
      properties:
        id: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }

    ActivityAssistantRequest:
      type: object
      required: [messages, today, now, language, type]
      properties:
        messages:
          description: The conversation so far, oldest first
          type: array
          minItems: 1
          maxItems: 40
          items: { $ref: '#/components/schemas/AssistantMessage' }
        today: { type: string, format: date, description: 'The phone''s local date, for "tomorrow" and the like' }
        now: { type: string, pattern: '^\d{2}:\d{2}$', description: 'The phone''s local time, for "in two hours"' }
        language: { type: string, enum: [pl, en, de, it, es, fr, ro, ru, sl, hr] }
        type: { type: string, enum: [note, call, task, meeting] }
        needs_company: { type: boolean, default: false, description: Recognise the company by name (assistant opened outside a card) }
        source_type: { type: string, enum: [lead, partner], description: 'The card the assistant was opened in; with source_id it lets a meeting''s participants be matched with that company''s contacts' }
        source_id: { type: string, maxLength: 64 }

    AssistantParticipant:
      type: object
      required: [name, email]
      properties:
        name: { type: string }
        email: { type: string }

    ActivityAssistantResponse:
      type: object
      required: [reply, complete, intent, participants, unknown_participants, companies]
      properties:
        reply: { type: string, description: 'What the assistant understood, and a question when something essential is missing' }
        complete: { type: boolean, description: Enough is known to open the form }
        intent:
          type: object
          required: [title, body, activity_at, meeting_location, reminder, priority, assigned_to, assigned_to_name, company_name]
          properties:
            title: { type: string, nullable: true, description: Only for a task or meeting }
            body: { type: string, nullable: true }
            activity_at: { type: string, nullable: true, description: 'Local date and time, YYYY-MM-DDTHH:MM; only for a task or meeting' }
            meeting_location: { type: string, nullable: true }
            reminder: { type: string, nullable: true, enum: [none, 30m_before, 1h_before, at_due, 1d_before, 2d_before, 3d_before, null], description: '"none" means the person wants no reminder; null that it was not said' }
            priority: { type: string, nullable: true, enum: [asap, important, medium, low, null] }
            assigned_to: { type: string, nullable: true, description: User id of the person named to do it }
            assigned_to_name: { type: string, nullable: true }
            company_name: { type: string, nullable: true, description: The company as the person said it; only with needs_company }
        participants:
          description: 'People named for a meeting, matched by first name and surname with the contacts of the card''s company and the team; empty with needs_company (see companies)'
          type: array
          items: { $ref: '#/components/schemas/AssistantParticipant' }
        unknown_participants:
          description: Names that fit nobody, or more than one person
          type: array
          items: { type: string }
        companies:
          description: Leads and partners matching company_name; empty without needs_company
          type: array
          items:
            type: object
            required: [source_type, source_id, name, participants, unknown_participants]
            properties:
              source_type: { type: string, enum: [lead, partner] }
              source_id: { type: string }
              name: { type: string }
              participants:
                description: The people named, matched with this company's contacts and the team
                type: array
                items: { $ref: '#/components/schemas/AssistantParticipant' }
              unknown_participants: { type: array, items: { type: string } }

    ProjectTaskAssistantRequest:
      type: object
      required: [messages, today, language]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 40
          items: { $ref: '#/components/schemas/AssistantMessage' }
        today: { type: string, format: date }
        language: { type: string, enum: [pl, en, de, it, es, fr, ro, ru, sl, hr] }
        types: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/AssistantOption' } }
        priorities: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/AssistantOption' } }
        members: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/AssistantOption' } }

    ProjectTaskAssistantResponse:
      type: object
      required: [reply, complete, intent]
      properties:
        reply: { type: string }
        complete: { type: boolean }
        intent:
          type: object
          required: [name, description, start_date, end_date, type_id, priority_id, assignee_ids]
          properties:
            name: { type: string, nullable: true }
            description: { type: string, nullable: true }
            start_date: { type: string, format: date, nullable: true }
            end_date: { type: string, format: date, nullable: true }
            type_id: { type: string, nullable: true, description: One of the types sent in the request }
            priority_id: { type: string, nullable: true }
            assignee_ids: { type: array, items: { type: string } }

    DashboardResponse:
      type: object
      required: [kpis, funnel, chart]
      properties:
        kpis:
          type: object
          required: [new_leads, new_leads_previous, new_leads_value_pln, new_leads_value_previous_pln, active_leads, pipeline_value_pln, month_won_count, month_won_value_pln]
          properties:
            new_leads: { type: integer, description: Leads created in the week }
            new_leads_previous: { type: integer, description: Leads created in the week before }
            new_leads_value_pln: { type: number }
            new_leads_value_previous_pln: { type: number }
            active_leads: { type: integer, description: 'Leads past "new", not closed and not on hold' }
            pipeline_value_pln: { type: number, description: Value of those leads in whole PLN }
            month_won_count: { type: integer }
            month_won_value_pln: { type: number }
        funnel:
          description: 'Open stages in funnel order, each present even when empty; leads on hold are left out'
          type: array
          items:
            type: object
            required: [stage, count, value_pln]
            properties:
              stage: { type: string, enum: [new, qualification, presentation, offer, negotiation] }
              count: { type: integer }
              value_pln: { type: number }
        chart:
          type: object
          required: [period_days, total_pln, previous_total_pln, points]
          properties:
            period_days: { type: integer }
            total_pln: { type: number, description: Value won in the period }
            previous_total_pln: { type: number, description: Value won in the period of the same length before it }
            points:
              description: 'Value won so far, one number per day of the period, oldest first'
              type: array
              items: { type: number }

    RecentActivity:
      type: object
      required: [uid, type, source_type, source_id]
      properties:
        uid: { type: string, description: Unique across all sources }
        type: { type: string, description: 'note, call, meeting, task, email, …' }
        title: { type: string, nullable: true }
        status: { type: string, nullable: true }
        source_type: { type: string, enum: [lead, partner, onboarding, document] }
        source_id: { type: string, description: 'Lead id, partner id (also for onboarding) or document id' }
        source_name: { type: string, nullable: true }
        activity_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
        assigned_to_name: { type: string, nullable: true }

    TodayKpis:
      type: object
      required: [active_leads, pipeline_value_pln, month_won_value_pln, month_budget_pln]
      properties:
        active_leads: { type: integer, description: 'Own leads past "new", not closed and not on hold' }
        pipeline_value_pln: { type: number, description: 'Value of those leads in PLN, rounded to whole PLN' }
        month_won_value_pln: { type: number, description: 'Value of own leads won in the month, in whole PLN' }
        month_budget_pln: { type: number, description: 'Planned budget for the month in whole PLN; 0 when no budget is set' }

    ProjectPerson:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string, nullable: true }

    ProjectDictionaryItem:
      description: A status, type, priority or cost category from the company's own dictionaries
      type: object
      required: [id, name, sort_order, is_active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string, description: 'Hex colour, e.g. `#3B82F6`; cost categories have none' }
        category: { type: string, enum: [todo, in_progress, done], description: 'Statuses only: the fixed meaning behind the company''s name' }
        sort_order: { type: integer }
        is_active: { type: boolean, description: Inactive items are kept so old tasks still show their name; do not offer them for new choices }

    ProjectsConfig:
      type: object
      required: [statuses, types, priorities, transitions, field_definitions, finance_enabled, cost_categories, at_risk_threshold_days, has_cross_project_view]
      properties:
        statuses: { type: array, items: { $ref: '#/components/schemas/ProjectDictionaryItem' } }
        types: { type: array, items: { $ref: '#/components/schemas/ProjectDictionaryItem' } }
        priorities: { type: array, items: { $ref: '#/components/schemas/ProjectDictionaryItem' } }
        transitions:
          description: 'Status changes each project role may make; a PM may make any. For one task use `permissions.allowed_status_ids` instead'
          type: array
          items:
            type: object
            required: [role, from_status_id, to_status_id]
            properties:
              role: { type: string, enum: [internal_participant, external_participant, controller] }
              from_status_id: { type: string, format: uuid }
              to_status_id: { type: string, format: uuid }
        field_definitions:
          description: Custom task fields the company defined; a project uses the ones on its card
          type: array
          items:
            type: object
            required: [id, name, field_type, options, sort_order, is_active]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              field_type: { type: string, enum: [text, number, list, date, money] }
              options: { type: array, items: { type: string }, description: 'Allowed values of a `list` field; empty for other types' }
              sort_order: { type: integer }
              is_active: { type: boolean }
        finance_enabled: { type: boolean, description: The company uses project finance }
        cost_categories:
          description: Empty while project finance is switched off
          type: array
          items: { $ref: '#/components/schemas/ProjectDictionaryItem' }
        at_risk_threshold_days: { type: integer, description: 'A "to do" task due within this many days (today included) is at risk' }
        has_cross_project_view: { type: boolean, description: The user may use the `/projects/portfolio` routes }

    ProjectTaskDeadline:
      description: |
        Deadline control of a task. Everything here is worked out by the
        server when it is read ("today" is the date in Europe/Warsaw) — the
        app shows it and never computes its own.
      type: object
      required: [original_end_date, completed_at, slip_days, timeliness, days_overdue, is_completed_late, has_overdue_subtasks]
      properties:
        original_end_date: { type: string, format: date, nullable: true, description: The first due date the task ever had; later changes never overwrite it }
        completed_at: { type: string, format: date-time, nullable: true, description: 'When the task entered a "done" status; null while it is not done' }
        slip_days: { type: integer, nullable: true, description: 'Due date minus the original one; null when they are equal or one is missing, negative when brought forward' }
        timeliness:
          type: string
          nullable: true
          enum: [overdue, at_risk, on_time, null]
          description: |
            `overdue` — due before today and not done; `at_risk` — not yet
            started ("to do") and due within the company's threshold;
            `on_time` — any other open task with a due date. Null without a
            due date and once done.
        days_overdue: { type: integer, nullable: true, description: Only for an overdue task }
        is_completed_late: { type: boolean, description: 'Done, but after its due date' }
        has_overdue_subtasks:
          type: boolean
          description: 'A subtask at any depth is overdue. A weaker marker: the task itself is not overdue because of it'

    ProjectTaskRow:
      description: |
        A task as a flat row of the filtered lists and the timeline: it names
        its project, parent, status, priority and type instead of nesting.
      allOf:
        - $ref: '#/components/schemas/ProjectTaskDeadline'
        - type: object
          required: [id, project_id, project_key, project_name, task_number, name, status_id, status_name, status_category, status_color, assignees]
          properties:
            id: { type: string, format: uuid }
            project_id: { type: string, format: uuid }
            project_key: { type: string, description: 'Prefix of the task number: `WSC` in `WSC-12`' }
            project_name: { type: string }
            task_number: { type: integer }
            name: { type: string }
            start_date: { type: string, format: date, nullable: true }
            end_date: { type: string, format: date, nullable: true, description: 'The due date; a task has no due time' }
            parent_task_id: { type: string, format: uuid, nullable: true }
            parent_task_number: { type: integer, nullable: true, description: Null for a top-level task and when the user may not see the parent }
            parent_task_name: { type: string, nullable: true }
            status_id: { type: string, format: uuid }
            status_name: { type: string }
            status_category: { type: string, enum: [todo, in_progress, done] }
            status_color: { type: string }
            priority_id: { type: string, format: uuid, nullable: true }
            priority_name: { type: string, nullable: true }
            priority_color: { type: string, nullable: true }
            type_id: { type: string, format: uuid, nullable: true }
            type_name: { type: string, nullable: true }
            type_color: { type: string, nullable: true }
            cost_total:
              type: number
              nullable: true
              description: |
                Sum of the cost items booked on the task itself (planned and
                incurred, without its subtasks). Null for someone who may not
                read the project's finance and while finance is switched off.
            cost_currency: { type: string, nullable: true, description: The project's currency; null together with `cost_total` }
            assignees: { type: array, items: { $ref: '#/components/schemas/ProjectPerson' } }

    ProjectTaskListResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProjectTaskRow' } }
        total: { type: integer, description: Tasks matching the filters on all pages }
        page: { type: integer }
        page_size: { type: integer }

    ProjectGanttResponse:
      type: object
      required: [items, truncated, limit]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProjectTaskRow' } }
        truncated: { type: boolean, description: More tasks match than `limit`; ask the user to narrow the filters }
        limit: { type: integer, example: 500 }

    ProjectTask:
      description: |
        A task of the project view. Status, type and priority are ids into
        `GET /projects/config`.
      allOf:
        - $ref: '#/components/schemas/ProjectTaskDeadline'
        - type: object
          required: [id, project_id, task_number, name, status_id, status_category, custom_values, created_at, updated_at, assignees]
          properties:
            id: { type: string, format: uuid }
            project_id: { type: string, format: uuid }
            task_number: { type: integer }
            name: { type: string }
            description: { type: string, nullable: true }
            type_id: { type: string, format: uuid, nullable: true }
            status_id: { type: string, format: uuid }
            status_category: { type: string, enum: [todo, in_progress, done] }
            priority_id: { type: string, format: uuid, nullable: true }
            start_date: { type: string, format: date, nullable: true }
            end_date: { type: string, format: date, nullable: true }
            parent_task_id: { type: string, format: uuid, nullable: true }
            custom_values:
              type: object
              additionalProperties: true
              description: 'Values of the project''s custom fields, keyed by `field_definition_id`; a `money` value is `{ amount, currency }`'
            reminder_type: { type: string, nullable: true, enum: [at_due, 1d_before, 2d_before, 3d_before, custom, null] }
            reminder_at: { type: string, format: date-time, nullable: true, description: 'When the reminder goes out; relative kinds count from 09:00 Europe/Warsaw on the due date' }
            created_by: { type: string, format: uuid, nullable: true }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            assignees: { type: array, items: { $ref: '#/components/schemas/ProjectPerson' } }
            permissions:
              description: 'Only with a single task (GET and PATCH of one task): what the user may do with it. All false / empty in a closed project'
              type: object
              required: [can_edit_content, can_edit_structure, allowed_status_ids]
              properties:
                can_edit_content: { type: boolean, description: 'Name, description, type, priority, dates, custom fields, reminder' }
                can_edit_structure: { type: boolean, description: Parent task and assignees }
                allowed_status_ids: { type: array, items: { type: string, format: uuid }, description: Statuses the user may move the task to from its current one }

    ProjectTaskCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, nullable: true, maxLength: 20000 }
        type_id: { type: string, format: uuid, nullable: true }
        priority_id: { type: string, format: uuid, nullable: true }
        status_id: { type: string, format: uuid, description: 'An active status; without it the first "to do" status' }
        start_date: { type: string, format: date, nullable: true }
        end_date: { type: string, format: date, nullable: true, description: Not before `start_date` }
        parent_task_id: { type: string, format: uuid, nullable: true, description: A task of the same project }
        assignee_ids: { type: array, maxItems: 100, items: { type: string, format: uuid }, description: Members of the project }
        custom_values: { type: object, additionalProperties: true, description: 'Values of the project''s custom fields, keyed by `field_definition_id`; required fields must be present' }
        reminder_type: { type: string, nullable: true, enum: [at_due, 1d_before, 2d_before, 3d_before, custom, null] }
        reminder_at: { type: string, format: date-time, nullable: true, description: Required with `reminder_type` `custom` }

    ProjectTaskUpdate:
      description: Only the fields that change. `assignee_ids` replaces the whole list; `custom_values` changes the fields it names.
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, nullable: true, maxLength: 20000 }
        type_id: { type: string, format: uuid, nullable: true }
        priority_id: { type: string, format: uuid, nullable: true }
        status_id: { type: string, format: uuid }
        start_date: { type: string, format: date, nullable: true }
        end_date: { type: string, format: date, nullable: true }
        end_date_change_reason: { type: string, nullable: true, maxLength: 500, description: 'Why the due date moves; optional, ignored unless `end_date` really changes' }
        parent_task_id: { type: string, format: uuid, nullable: true }
        assignee_ids: { type: array, maxItems: 100, items: { type: string, format: uuid } }
        custom_values: { type: object, additionalProperties: true }
        reminder_type: { type: string, nullable: true, enum: [at_due, 1d_before, 2d_before, 3d_before, custom, null] }
        reminder_at: { type: string, format: date-time, nullable: true }

    ProjectTaskSummary:
      description: A task as lists outside the project show it — it carries its status and priority by name
      allOf:
        - $ref: '#/components/schemas/ProjectTaskDeadline'
        - type: object
          required: [id, project_id, task_number, name, status_id, status_name, status_color, status_category, assignees]
          properties:
            id: { type: string, format: uuid }
            project_id: { type: string, format: uuid }
            task_number: { type: integer }
            name: { type: string }
            start_date: { type: string, format: date, nullable: true }
            end_date: { type: string, format: date, nullable: true }
            parent_task_id: { type: string, format: uuid, nullable: true }
            status_id: { type: string, format: uuid }
            status_name: { type: string }
            status_color: { type: string }
            status_category: { type: string, enum: [todo, in_progress, done] }
            priority_name: { type: string, nullable: true }
            priority_color: { type: string, nullable: true }
            assignees: { type: array, items: { $ref: '#/components/schemas/ProjectPerson' } }

    AssignedProjectTask:
      allOf:
        - $ref: '#/components/schemas/ProjectTaskSummary'
        - type: object
          required: [project_key, project_name, updated_at]
          properties:
            project_key: { type: string }
            project_name: { type: string }
            reminder_type: { type: string, nullable: true }
            reminder_at: { type: string, format: date-time, nullable: true }
            updated_at: { type: string, format: date-time }

    ProjectDelay:
      description: |
        Whether the project is delayed — worked out by the server. Only an
        open project with an end date can be delayed.
      type: object
      required: [is_delayed, delay_reasons, delay_details]
      properties:
        is_delayed: { type: boolean }
        delay_reasons:
          description: '`task_after_end` — an open task is due after the project''s end date; `end_passed` — the end date has passed and open tasks remain'
          type: array
          items: { type: string, enum: [task_after_end, end_passed] }
        delay_details:
          type: object
          required: [open_task_count, tasks_after_end_count]
          properties:
            open_task_count: { type: integer, description: Tasks not done }
            tasks_after_end_count: { type: integer, description: Open tasks due after the project's end date }
            latest_task_end_date: { type: string, format: date, nullable: true, description: The latest due date among those tasks }
            days_after_end: { type: integer, nullable: true, description: Days between the project's end date and that due date }
            days_past_end: { type: integer, nullable: true, description: 'Days since the project''s end date; only with `end_passed`' }

    ProjectSummary:
      description: A project as a row of the project lists
      allOf:
        - $ref: '#/components/schemas/ProjectDelay'
        - type: object
          required: [id, key, name, status, created_at, member_count, task_count, done_task_count, overdue_task_count, at_risk_task_count, progress_percent, my_open_task_count, project_managers, finance]
          properties:
            id: { type: string, format: uuid }
            key: { type: string, description: 'Prefix of the task numbers, never changed' }
            name: { type: string }
            description: { type: string, nullable: true }
            status: { type: string, enum: [open, closed], description: A closed project is read-only }
            lead_id: { type: integer, nullable: true, description: 'A project is linked to one lead, one partner or neither' }
            lead_name: { type: string, nullable: true }
            partner_id: { type: string, format: uuid, nullable: true }
            partner_name: { type: string, nullable: true }
            start_date: { type: string, format: date, nullable: true }
            end_date: { type: string, format: date, nullable: true, description: Tasks may be due after it — the project is then delayed }
            created_at: { type: string, format: date-time }
            closed_at: { type: string, format: date-time, nullable: true }
            my_role: { type: string, nullable: true, enum: [pm, internal_participant, external_participant, controller, null], description: Null for a tenant admin who is not a member }
            my_access_level: { type: string, nullable: true, enum: [full, read, null] }
            member_count: { type: integer }
            task_count: { type: integer }
            done_task_count: { type: integer }
            overdue_task_count: { type: integer }
            at_risk_task_count: { type: integer }
            progress_percent: { type: integer, description: 'Share of done tasks in whole percent, 0 without tasks; show this number, do not compute another' }
            my_open_task_count: { type: integer, description: Open tasks assigned to the user }
            project_managers: { type: array, items: { $ref: '#/components/schemas/ProjectPerson' } }
            finance: { $ref: '#/components/schemas/ProjectFinanceTotals' }

    ProjectListResponse:
      type: object
      required: [items, total, page, page_size, can_filter_finance]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProjectSummary' } }
        total: { type: integer, description: Projects matching the filters on all pages }
        page: { type: integer }
        page_size: { type: integer }
        can_filter_finance: { type: boolean, description: Offer the cost and revenue filters and sort keys only when true }
        can_create: { type: boolean, description: '`GET /projects` only: the user may create projects' }
        projects:
          deprecated: true
          description: '`GET /projects` only: the same rows as `items`, under the name used before paging. Read `items`'
          type: array
          items: { $ref: '#/components/schemas/ProjectSummary' }

    ProjectMember:
      type: object
      required: [user_id, role, access_level, is_external, is_active]
      properties:
        user_id: { type: string, format: uuid }
        role: { type: string, enum: [pm, internal_participant, external_participant, controller] }
        access_level: { type: string, enum: [full, read], description: 'A PM always has `full`, a controller always `read`' }
        display_name: { type: string, nullable: true }
        email: { type: string }
        phone: { type: string, nullable: true }
        company: { type: string, nullable: true }
        department: { type: string, nullable: true }
        is_external: { type: boolean, description: An account that only uses the Projects module }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time, description: When the person joined the project }

    ProjectField:
      description: A custom task field the PM attached to the project
      type: object
      required: [field_definition_id, name, field_type, is_required]
      properties:
        field_definition_id: { type: string, format: uuid, description: Key of the value in a task's `custom_values` }
        name: { type: string }
        field_type: { type: string, enum: [text, number, list, date, money] }
        options: { type: array, items: { type: string } }
        is_required: { type: boolean }
        sort_order: { type: integer }
        is_active: { type: boolean }

    ProjectCard:
      type: object
      required: [project, members, fields, my_role, my_access_level, can_manage, finance]
      properties:
        project:
          allOf:
            - $ref: '#/components/schemas/ProjectDelay'
            - type: object
              required: [id, key, name, status, created_at]
              properties:
                id: { type: string, format: uuid }
                key: { type: string }
                name: { type: string }
                description: { type: string, nullable: true }
                status: { type: string, enum: [open, closed] }
                lead_id: { type: integer, nullable: true }
                lead_name: { type: string, nullable: true }
                partner_id: { type: string, format: uuid, nullable: true }
                partner_name: { type: string, nullable: true }
                start_date: { type: string, format: date, nullable: true }
                end_date: { type: string, format: date, nullable: true }
                created_at: { type: string, format: date-time }
                updated_at: { type: string, format: date-time }
                closed_at: { type: string, format: date-time, nullable: true }
        members:
          description: PMs first, then by name
          type: array
          items: { $ref: '#/components/schemas/ProjectMember' }
        fields: { type: array, items: { $ref: '#/components/schemas/ProjectField' } }
        my_role:
          type: string
          nullable: true
          enum: [pm, internal_participant, external_participant, controller, null]
          description: 'The user''s role — here, next to `project`, not inside it. Null for a tenant admin who is not a member'
        my_access_level: { type: string, nullable: true, enum: [full, read, null] }
        can_manage: { type: boolean, description: The user is a PM of the project or a tenant admin }
        finance: { $ref: '#/components/schemas/ProjectFinanceAccess' }

    ProjectFinanceAccess:
      description: |
        What the user may do with the project's finance. Null when the company
        has project finance switched off or the user may see none of it — take
        the permissions from here, never from the role.
      type: object
      nullable: true
      required: [currency, can_read, can_write, can_add_own_costs]
      properties:
        currency: { type: string, example: PLN }
        can_read: { type: boolean, description: 'May open the summary and every cost item (PM, tenant admin, controller)' }
        can_write: { type: boolean, description: False in a closed project }
        can_add_own_costs: { type: boolean, description: 'An internal participant the PM allowed to add costs to own tasks; sees only own cost items' }

    ProjectMargin:
      type: object
      required: [amount, percent]
      properties:
        amount: { type: number, nullable: true, description: Revenue minus cost; null without a planned revenue }
        percent: { type: number, nullable: true, description: 'In percentage points (12.5 = 12.5%); null without revenue' }

    ProjectFinanceTotals:
      description: |
        Finance totals of a project, net, in its one currency. Null when the
        user may not read them or project finance is switched off. Actual
        revenue = invoiced and paid items; actual cost = incurred items;
        planned cost = the sum of the category budgets.
      type: object
      nullable: true
      required: [currency, revenue, cost, margin]
      properties:
        currency: { type: string, example: PLN }
        revenue:
          type: object
          required: [planned, actual]
          properties:
            planned: { type: number, nullable: true }
            actual: { type: number }
        cost:
          type: object
          required: [planned, actual]
          properties:
            planned: { type: number }
            actual: { type: number }
        margin:
          type: object
          required: [planned, actual]
          properties:
            planned: { $ref: '#/components/schemas/ProjectMargin' }
            actual: { $ref: '#/components/schemas/ProjectMargin' }

    ProjectFinanceSummary:
      type: object
      required: [currency, is_currency_locked, participants_can_add_costs, revenue, suggested_planned_revenue, cost, margin, remaining_budget, categories, tasks]
      properties:
        currency: { type: string, example: PLN }
        is_currency_locked: { type: boolean, description: The project already has cost or revenue items }
        participants_can_add_costs: { type: boolean }
        revenue:
          type: object
          required: [planned, actual, by_status]
          properties:
            planned: { type: number, nullable: true }
            actual: { type: number, description: Invoiced and paid items }
            by_status:
              type: object
              required: [planned, invoiced, paid]
              properties:
                planned: { type: number }
                invoiced: { type: number }
                paid: { type: number }
        suggested_planned_revenue:
          type: number
          nullable: true
          description: 'Value of the linked lead in the project''s currency, offered only while no planned revenue is set; nothing is saved'
        cost:
          type: object
          required: [planned, actual, planned_items, task_planned_total]
          properties:
            planned: { type: number, description: Sum of the category budgets }
            actual: { type: number, description: Incurred cost items }
            planned_items: { type: number, description: Cost items still only planned }
            task_planned_total: { type: number, description: 'Sum of the planned costs of tasks; reported next to the budget, never added to it' }
        margin:
          type: object
          required: [planned, actual]
          properties:
            planned: { $ref: '#/components/schemas/ProjectMargin' }
            actual: { $ref: '#/components/schemas/ProjectMargin' }
        remaining_budget: { type: number, description: Planned cost minus actual cost; negative when over budget }
        categories:
          description: 'Cost categories in the company''s order; an inactive one only while it still has a budget or items'
          type: array
          items:
            type: object
            required: [category_id, name, is_active, budget, incurred, planned, variance, is_over_budget]
            properties:
              category_id: { type: string, format: uuid }
              name: { type: string }
              is_active: { type: boolean }
              budget: { type: number, description: 0 without a budget }
              incurred: { type: number }
              planned: { type: number, description: Cost items still only planned }
              variance: { type: number, description: Budget minus incurred }
              is_over_budget: { type: boolean }
        tasks:
          description: 'Tasks that have a planned cost or cost items, by task number'
          type: array
          items:
            type: object
            required: [task_id, task_number, name, own_incurred, own_planned, total_incurred, total_planned]
            properties:
              task_id: { type: string, format: uuid }
              task_number: { type: integer }
              name: { type: string }
              parent_task_id: { type: string, format: uuid, nullable: true }
              planned_cost: { type: number, nullable: true }
              own_incurred: { type: number, description: Incurred items booked on the task itself }
              own_planned: { type: number }
              total_incurred: { type: number, description: The task's own items plus those of all its subtasks }
              total_planned: { type: number }

    ProjectCostItem:
      type: object
      required: [id, project_id, date, amount, category_id, category_name, status, created_at, updated_at, ksef_invoice, document, other_links]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        date: { type: string, format: date }
        amount: { type: number, description: Net amount in the project's currency }
        category_id: { type: string, format: uuid }
        category_name: { type: string }
        status: { type: string, enum: [planned, incurred] }
        description: { type: string, nullable: true }
        task_id: { type: string, format: uuid, nullable: true }
        task_number: { type: integer, nullable: true }
        task_name: { type: string, nullable: true }
        supplier_name: { type: string, nullable: true }
        document_number: { type: string, nullable: true }
        original_amount: { type: number, nullable: true, description: The amount as entered when the cost was in another currency }
        original_currency: { type: string, nullable: true }
        exchange_rate: { type: number, nullable: true, description: Filled only when `amount` was computed from an NBP rate }
        exchange_rate_date: { type: string, format: date, nullable: true }
        ksef_invoice_id: { type: string, format: uuid, nullable: true }
        document_id: { type: string, format: uuid, nullable: true }
        created_by: { type: string, format: uuid, nullable: true }
        created_by_name: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        ksef_invoice:
          description: Summary of the linked KSeF purchase invoice (KSeF itself is web-only); show `invoice_number`
          type: object
          nullable: true
          additionalProperties: true
          properties:
            id: { type: string, format: uuid }
            invoice_number: { type: string, nullable: true }
            seller_name: { type: string, nullable: true }
        document:
          description: The linked invoice document of the Documents module
          type: object
          nullable: true
          additionalProperties: true
          properties:
            id: { type: string, format: uuid }
            invoice_number: { type: string, nullable: true }
        other_links:
          description: 'Every other cost item — in any project — linked to the same invoice; when not empty, warn that the invoice is booked elsewhere too'
          type: array
          items:
            type: object
            required: [cost_item_id, project_id]
            additionalProperties: true
            properties:
              cost_item_id: { type: string, format: uuid }
              project_id: { type: string, format: uuid }
              project_key: { type: string }
              project_name: { type: string }
              task_id: { type: string, format: uuid, nullable: true }
              task_number: { type: integer, nullable: true }
              task_name: { type: string, nullable: true }
              amount: { type: number }
              currency: { type: string }
              status: { type: string }

    LinkedProject:
      description: 'A project run for a lead or a partner, as their card shows it: its state, its tasks and its finance totals'
      allOf:
        - $ref: '#/components/schemas/ProjectDelay'
        - type: object
          required: [id, key, name, status, created_at, can_open, tasks, finance]
          properties:
            id: { type: string, format: uuid }
            key: { type: string }
            name: { type: string }
            status: { type: string, enum: [open, closed] }
            start_date: { type: string, format: date, nullable: true }
            end_date: { type: string, format: date, nullable: true }
            created_at: { type: string, format: date-time }
            closed_at: { type: string, format: date-time, nullable: true }
            can_open: { type: boolean, description: 'The user is a member (or a tenant admin) and may enter the project; otherwise this summary is all they see' }
            tasks:
              description: 'Every task of the project, by task number'
              type: array
              items: { $ref: '#/components/schemas/ProjectTaskSummary' }
            finance: { $ref: '#/components/schemas/ProjectFinanceTotals' }

    ProjectMessage:
      type: object
      required: [id, body, created_at]
      properties:
        id: { type: string, format: uuid }
        body: { type: string }
        created_at: { type: string, format: date-time }
        author_id: { type: string, format: uuid, nullable: true, description: Null once the author's account is deleted }
        author_name: { type: string, nullable: true }

    ProjectMessageCreate:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }

    ProjectTaskHistoryEntry:
      type: object
      required: [id, action, created_at]
      properties:
        id: { type: string, format: uuid }
        action: { type: string, description: '`project_task_created` or `project_task_updated`' }
        user_name: { type: string, nullable: true }
        before_state: { type: object, nullable: true, additionalProperties: true, description: 'The changed fields under their API names, as they were; null for the creation' }
        after_state: { type: object, nullable: true, additionalProperties: true, description: The same fields after the change }
        end_date_change_reason: { type: string, nullable: true, description: 'Why the due date was moved, when the person said so' }
        created_at: { type: string, format: date-time }
